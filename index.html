<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Loan Application</title>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div
      class="w-full max-w-md bg-white rounded-xl shadow-sm border border-slate-200 p-8"
    >
      <div class="mb-8">
        <h1 class="text-2xl font-semibold text-slate-900">Loan Application</h1>
        <p class="text-slate-500 mt-1">
          Please fill in the details below to proceed.
        </p>
      </div>

      <form id="loanForm" class="space-y-6">
        <div>
          <label
            for="creditScore"
            class="block text-sm font-medium text-slate-700 mb-1"
            >Credit Score</label
          >
          <input
            type="number"
            id="creditScore"
            class="w-full px-4 py-2.5 bg-white border border-slate-300 rounded-lg text-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
            placeholder="Input your credit score"
          />
        </div>

        <div>
          <label
            for="loanAmount"
            class="block text-sm font-medium text-slate-700 mb-1"
            >Loan Amount </label
          >
          <input
            type="number"
            id="loanAmount"
            class="w-full px-4 py-2.5 bg-white border border-slate-300 rounded-lg text-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition-all"
            placeholder="Enter yuor loan Amount"
          />
        </div>

        <div id="messages" class="min-h-[1.25rem] text-sm"></div>

        <button
          type="submit"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900"
        >
          Submit Application
        </button>
      </form>
    </div>

    <script src="index.js"></script>
  </body>
</html>
